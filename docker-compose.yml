services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: grupo_sucuarana
      MYSQL_USER: grupo_sucuarana
      MYSQL_PASSWORD: local-change-me
      MYSQL_ROOT_PASSWORD: local-root-change-me
    ports:
      - "3306:3306"
    volumes:
      - grupo-sucuarana-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  grupo-sucuarana-mysql:
