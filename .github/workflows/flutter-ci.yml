name: Flutter CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Analyze and test mobile app
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        env:
          PDF_LAYOUT_OUTPUT: build/pdf-validation/report-ficticio.pdf
        run: flutter test --coverage

      - name: Enforce minimum line coverage
        shell: bash
        run: |
          awk -F: '
            /^LF:/ { total += $2 }
            /^LH:/ { hit += $2 }
            END {
              if (total == 0 || hit / total < 0.50) {
                printf "Line coverage %.1f%% is below the 50%% minimum\n", (hit / total) * 100
                exit 1
              }
              printf "Line coverage: %.1f%%\n", (hit / total) * 100
            }
          ' coverage/lcov.info

      - name: Check PDF page-level layout
        shell: bash
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          python3 tool/check_pdf_layout.py build/pdf-validation/report-ficticio.pdf
          pdftoppm -scale-to 900 -png \
            build/pdf-validation/report-ficticio.pdf \
            build/pdf-validation/page

      - name: Upload fictional PDF and page previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-layout-preview
          path: app-mobile/build/pdf-validation/
          if-no-files-found: warn

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: app-mobile/coverage/lcov.info
          if-no-files-found: error

  backend:
    name: Test backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn --batch-mode test
