name: Dependency Review

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Check dependencies for high-severity vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
