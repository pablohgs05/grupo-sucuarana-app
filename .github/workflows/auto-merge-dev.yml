name: Enable auto-merge for dev

on:
  pull_request_target:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# This workflow intentionally does not check out or execute PR code.
# pull_request_target uses the trusted workflow from the base branch.
permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge when requirements are met
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash
