name: Enable auto-merge for dev

on:
  pull_request_target:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# This workflow intentionally does not check out or execute PR code.
# pull_request_target uses the trusted workflow from the base branch.
permissions:
  contents: read

concurrency:
  group: auto-merge-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Needed by GitHub CLI to enable auto-merge.
      contents: write
      # Needed to update the pull request's merge state.
      pull-requests: write
    steps:
      - name: Enable squash auto-merge when requirements are met
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPO: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$PR_HEAD_SHA"
