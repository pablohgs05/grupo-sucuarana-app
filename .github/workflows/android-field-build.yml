name: Android Field Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
    paths:
      - 'app-mobile/**'
      - '.github/workflows/android-field-build.yml'
  push:
    branches:
      - dev
    paths:
      - 'app-mobile/**'
      - '.github/workflows/android-field-build.yml'

permissions:
  contents: read

concurrency:
  group: android-field-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest

    env:
      FIELD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    defaults:
      run:
        working-directory: app-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.FIELD_SHA }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Prepare field-test artifact
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          cp build/app/outputs/flutter-apk/app-debug.apk             "$RUNNER_TEMP/grupo-sucuarana-m10-${short_sha}.apk"

      - name: Upload Android field-test APK
        uses: actions/upload-artifact@v7
        with:
          name: grupo-sucuarana-m10-${{ env.FIELD_SHA }}
          path: ${{ runner.temp }}/grupo-sucuarana-m10-*.apk
          if-no-files-found: error
          retention-days: 14
