# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "pt-BR"
early_access: false
enable_free_tier: true

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  commit_status: true
  poem: false
  collapse_walkthrough: true
  path_filters: []
  path_instructions:
    - path: "app-mobile/**/*.dart"
      instructions: |
        Review this Flutter/Dart application as a reliability-focused offline-first mobile app.
        Check correctness, null safety, async lifecycle and mounted checks, resource disposal, error/loading states, accessibility, and Riverpod state ownership.
        Preserve the existing presentation/application/domain/data/services boundaries and avoid introducing unnecessary architecture or dependencies.
        The core report workflow must work without internet: persist locally before network calls, never lose drafts or attachments on failures, and make retries safe.
        Check SQLite consistency, migrations, serialization, date/time handling, image/file lifecycle, PDF generation, pagination, and memory use where relevant.
        Require focused tests for new behavior and regression tests for bugs. Prefer deterministic tests with fakes/mocks; do not rely on real network, real user data, or flaky timing.
        Do not claim a feature is implemented when it is only documented or stubbed. Explain concrete impact and give actionable fixes.
    - path: "app-mobile/**/*test.dart"
      instructions: |
        Review tests for meaningful behavioral assertions, edge cases, failure paths, and regression coverage rather than line coverage alone.
        Prefer deterministic unit/widget tests with controlled fakes and mocks. Avoid real network calls, production data, unnecessary sleeps, and assertions that merely mirror implementation details.
        For offline-first flows, cover persistence before sync, retry after transient failure, duplicate submission/idempotency, and preservation of local data when sync fails whenever applicable.
    - path: "backend/**/*.java"
      instructions: |
        Review the Spring Boot API for correctness, secure defaults, input validation, authorization boundaries, exception handling, transaction boundaries, and safe database access.
        Treat JWT authentication and authorization as not implemented unless the code actually enforces them; never assume a public endpoint is protected by documentation alone.
        Check DTO/entity separation, validation of request bodies, idempotent report synchronization, duplicate and race conditions, and safe handling of malformed or oversized input.
        Never expose secrets, tokens, personal data, victim details, stack traces, database internals, or environment configuration in logs or API responses.
        Check that health endpoints expose only minimal technical status. Require focused JUnit/Spring tests for success, invalid input, authorization, persistence, retries, and duplicate requests as applicable.
    - path: "backend/**/*Test.java"
      instructions: |
        Review tests for behavior and security, not just successful happy paths.
        Prefer deterministic JUnit/Spring tests with isolated data and explicit assertions. Cover invalid input, missing or insufficient authorization where applicable, duplicate/idempotent requests, persistence behavior, and safe error responses.
        Do not use real credentials, personal data, external production services, or order-dependent shared state.
    - path: "docs/**"
      instructions: |
        Check documentation against the actual code and CI configuration; flag claims that describe planned work as already implemented.
        Preserve the project's explicit offline-first, local-first privacy, idempotent synchronization, and LGPD principles. Call out security prerequisites and production blockers clearly.
        Never include real operational reports, victim details, personal data, photos, secrets, tokens, or private environment values.
    - path: ".github/workflows/**"
      instructions: |
        Review GitHub Actions for least-privilege permissions, untrusted pull request code execution, secret exposure, unsafe expression interpolation, dependency/action pinning, and whether failures actually block the intended workflow.
        Be especially careful with pull_request_target: do not check out or execute pull request head code in a privileged workflow.
        Ensure CI runs the relevant Flutter analysis/tests and backend tests, and do not treat a successful build as a substitute for tests or security review.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "main"
      - "dev"
    ignore_title_keywords:
      - "wip"
      - "skip-ci"

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"
      - "docs/02-arquitetura.md"
      - "docs/07-seguranca-lgpd.md"

chat:
  auto_reply: true
